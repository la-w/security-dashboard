<mat-sidenav-container class="sidenav-container">
  <mat-sidenav #sidenav class="sidenav" mode="over">
    <p>Soon<sup>TM</sup></p>
  </mat-sidenav>

  <mat-sidenav-content>
    <mat-toolbar class="header">
      <button mat-icon-button (click)="sidenav.toggle()">
        <mat-icon>menu</mat-icon>
      </button>
      <a mat-button routerLink="/dashboard" class="title"
        ><mat-icon>cottage</mat-icon>TBD_PWL Security Dashboard</a
      >
      <span class="spacer"></span>
      @if (isAuthenticated) {
        <span class="username">Hello, {{ displayName }}!</span>
        <button mat-icon-button (click)="logout()">
          <mat-icon>logout</mat-icon>
        </button>
      } @else {
        <span class="alt-text-user"><em>Not logged in</em></span>
      }
    </mat-toolbar>
    <router-outlet></router-outlet>
  </mat-sidenav-content>
</mat-sidenav-container>
