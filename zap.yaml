env:
  contexts:
    - name: Dashboard
      url: https://dashboard-dev.tbdpwl.dynv6.net
  parameters:
    failOnError: true
    failOnWarning: false

jobs:
  - type: passiveScan-config
    parameters:
      maxAlertsPerRule: 10
      scanOnlyInScope: true
  - type: spider
    parameters:
      maxDepth: 3
      maxDuration: 60
  - type: spiderAjax
    parameters:
      maxCrawlDepth: 5
      maxDuration: 240
  - type: passiveScan-wait
    parameters:
      maxDuration: 5
  - type: activeScan
    parameters:
      maxRuleDurationInMins: 3
      maxScanDurationInMins: 30
      delayInMs: 50
  - type: report
    parameters:
      template: sarif-json
      reportFile: Zap-Report.sarif
      reportTitle: ZAP Scan Report - Dashboard
